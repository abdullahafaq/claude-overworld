name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  biomes:
    name: Biomes, manifests and art
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contrast, motion and scene checks
        run: npm run check:biomes
      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugins/overworld/.claude-plugin/plugin.json plugins/overworld/hooks/hooks.json package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))" && echo "parsed $f"
          done
      - name: Committed art matches the code
        run: |
          npm run art
          git diff --exit-code -- assets docs/biomes docs/mobs docs/trailer.svg
